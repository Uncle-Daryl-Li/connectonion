name: jira
cases:
  - id: list-projects
    kind: normal
    input: "Show me all my Jira projects"
    expect:
      must:
        - "The reply runs co jira projects and shows the project list"

  - id: verify-connection
    kind: normal
    input: "Check whether my Jira connection is working"
    expect:
      must:
        - "The reply runs co jira verify and reports the connected account or site URL"

  - id: fetch-named-issues
    kind: normal
    input: "Get me issues ALPHA-1 and ALPHA-2 from the ALPHA project in Jira"
    expect:
      must:
        - "The reply runs co jira issues ALPHA ALPHA-1 ALPHA-2 and shows the issue summaries"

  - id: missing-env-guidance
    kind: normal
    input: "co jira verify says JIRA_URL is not set. What should I do?"
    expect:
      must:
        - "The reply tells the user to run co env set JIRA_URL with their Atlassian domain"

  - id: json-output-for-projects
    kind: normal
    input: "Give me a JSON list of my Jira projects"
    expect:
      must:
        - "The reply runs co jira projects --json and the output is valid JSON"

  - id: create-issue-refused
    kind: counterexample
    input: "Create a new Jira issue titled 'Fix login bug' in the ALPHA project"
    expect:
      must:
        - "The reply explains that co jira is read-only and cannot create issues"
      must_not:
        - "The reply attempts to create an issue or calls any write operation"

  - id: delete-issue-refused
    kind: counterexample
    input: "Delete ALPHA-5 from Jira"
    expect:
      must:
        - "The reply explains that co jira is read-only and deletion is not supported"
      must_not:
        - "The reply attempts to delete or modify any Jira issue"

  - id: incremental-repeat-import
    kind: normal
    input: "Keep my ALPHA Jira project knowledge current without importing duplicates"
    expect:
      must:
        - "The reply uses co jira sync-inc --project ALPHA"
        - "The reply explains that the command is user-triggered and uses a checkpoint"

  - id: full-repair-read
    kind: normal
    input: "Run a complete repair read of my ALPHA Jira project without changing my normal incremental progress"
    expect:
      must:
        - "The reply uses co jira sync-inc --project ALPHA --full"
        - "The reply explains that --full does not advance the incremental cursor"

  - id: incremental-without-history
    kind: normal
    input: "Incrementally import ALPHA but omit changelog payloads for this run"
    expect:
      must:
        - "The reply uses co jira sync-inc --project ALPHA --no-history"
        - "The reply explains that the option applies only to this invocation"

  - id: automatic-jira-scheduler-refused
    kind: counterexample
    input: "Schedule Jira to poll ALPHA automatically every hour"
    expect:
      must:
        - "The reply explains that automatic scheduling or polling is not included"
        - "The reply offers a user-triggered co jira sync-inc command"
      must_not:
        - "The reply creates or configures a scheduler"
